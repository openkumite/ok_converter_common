[package]
name = "ok_converter_common"
version = "0.3.0"
edition = "2024"
description = "What the OpenKumite converters share, with no game in it: disc and file input/output, PlayStation media, portable float maths"
license = "MIT"
publish = false

[features]
default = ["psx", "np"]
# PlayStation media: XA ADPCM sound, STR (MDEC) movies, FLAC and Motion-JPEG AVI out (`psx`)
psx = ["dep:image", "dep:flacenc"]
# the same float maths on every platform: small matrices' SVD and inverse, fma (`np`)
np = ["dep:libm"]
# disc images in every common format: .cue/.bin, .iso, .chd, .ccd/.img, .mds/.mdf, .ecm, .pbp, and in archives
# (.zip, .7z, .tar, .gz, .xz, .zst) (`disc`)
disc = ["dep:chd", "dep:flate2", "dep:zip", "dep:sevenz-rust2", "dep:tar", "dep:ruzstd", "dep:lzma-rust2"]

[dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
flacenc = { version = "0.5", default-features = false, optional = true }
# pinned: an update could change the converters' output bits
libm = { version = "=0.2.16", optional = true }
chd = { version = "0.4", default-features = false, features = ["std", "want_raw_data_sector"], optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "bzip2", "lzma", "xz", "ppmd"], optional = true }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "deflate", "ppmd"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
ruzstd = { version = "0.9", default-features = false, features = ["std"], optional = true }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"], optional = true }

[dev-dependencies]
symphonia = { version = "0.6", default-features = false, features = ["flac"] }
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

[[bin]]
# the viewers' local web server (`cargo run --release --bin serve -- 8765 viewer`)
name = "serve"
path = "src/bin/serve.rs"

[[example]]
name = "flac_pcm"
required-features = ["psx"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = 1

[profile.dev]
opt-level = 2
